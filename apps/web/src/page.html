<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Milagre Live</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Join me on Milagre Live" />
    <meta property="og:description" content="Screen share, voice and camera in the browser. Type a name and you're in." />
    <meta property="og:image" content="https://live.milagre.cloud/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --page: #f4f9fe;
        --surface: #ffffff;
        --field: #e8edf2;
        --hover: #1c222b0f;
        --line: #edeeee;
        --line-strong: #e0e1e3;
        --ink: #1c222b;
        --ink-2: #4b515a;
        --ink-3: #60656d;
        --on-ink: #ffffff;
        --accent: #007df3;
        --red-ink: #c62935;
        --on-red: #ffffff;
        --green: #199a4d;
        --media: #000000;
        --on-media: #ffffff;
        --hover-2: #1c222b1a;
        --dock: var(--surface);
        --dock-line: var(--line-strong);
        --dock-ink: var(--ink);
        --dock-ink-2: var(--ink-3);
        --dock-hover: var(--hover);
        --dock-on: var(--hover-2);
        --hangup: var(--red-ink);
        --on-hangup: var(--on-red);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d1624;
          --surface: #172232;
          --field: #212c3c;
          --hover: #e9eff70d;
          --line: #273242;
          --line-strong: #303b4a;
          --ink: #e9eff7;
          --ink-2: #abb2bd;
          --ink-3: #939ca9;
          --on-ink: #172232;
          --accent: #3e9afd;
          --red-ink: #fd696d;
          --on-red: #0d1624;
          --green: #3cbb72;
          --hover-2: #e9eff717;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--page);
        color: var(--ink);
        font:
          14px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Inter",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      @font-face {
        font-family: Geist;
        src: url(/fonts/geist.woff2) format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      .join {
        position: relative;
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        color: #fff;
        font-family: Geist, Inter, system-ui, sans-serif;
        background: linear-gradient(180deg, #0f1433 0%, #1f2357 24%, #463a7f 44%, #8c4f78 62%, #d9746a 80%, #f4a978 92%, #f9cf9b 100%);
      }
      .sky {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .horizon {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -18vh;
        height: 42vh;
        background: radial-gradient(60% 60% at 50% 100%, rgba(255, 214, 160, 0.55), transparent 70%);
        filter: blur(10px);
      }
      .star {
        position: absolute;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background: #fff;
        opacity: var(--low);
        animation: twinkle var(--d) ease-in-out var(--delay) infinite;
      }
      .star.big {
        box-shadow:
          0 0 6px 1px rgba(255, 255, 255, 0.7),
          0 0 14px 2px rgba(255, 200, 190, 0.35);
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: var(--low);
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.35);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .star {
          animation: none;
        }
      }
      .join-main {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 600px) minmax(0, 380px);
        gap: 56px;
        align-items: center;
        width: min(1036px, 100%);
      }
      .preview {
        position: relative;
        aspect-ratio: 16 / 10;
        border-radius: 24px;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: rgba(15, 12, 40, 0.55);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          0 24px 70px rgba(15, 8, 40, 0.45);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .preview video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }
      .preview-bot {
        width: 34%;
        aspect-ratio: 1;
      }
      .preview-change {
        position: absolute;
        right: 14px;
        top: 14px;
        padding: 6px 12px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #1f1a14;
        font-weight: 600;
        font-size: 12px;
      }
      .preview.camera-on .preview-bot,
      .preview.camera-on .preview-change {
        display: none;
      }
      .preview-tag {
        position: absolute;
        left: 14px;
        bottom: 14px;
        max-width: calc(50% - 70px);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border-radius: 10px;
        background: rgba(10, 8, 30, 0.55);
        font-size: 13px;
        font-weight: 500;
      }
      .preview-tag span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preview-meter {
        display: flex;
        gap: 2px;
        align-items: flex-end;
        height: 12px;
      }
      .preview-meter i {
        width: 3px;
        height: 3px;
        border-radius: 2px;
        background: #3ddc84;
        transition: height 0.09s;
      }
      .preview-controls {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .preview-toggle {
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .preview-toggle[aria-pressed="false"] {
        background: #ff4d57;
        box-shadow: none;
      }
      .preview-toggle .slash {
        display: none;
      }
      .preview-toggle[aria-pressed="false"] .slash {
        display: inline;
      }
      .join-form {
        display: grid;
        gap: 18px;
      }
      .here {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }
      .here-bots {
        display: flex;
      }
      .here-bots span {
        width: 28px;
        height: 28px;
        margin-left: -8px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: rgba(20, 16, 50, 0.55);
        box-shadow: 0 0 0 2px #2f2a63;
      }
      .here-bots span:first-child {
        margin-left: 0;
      }
      .here-bots svg {
        width: 22px;
        height: 22px;
      }
      .join-title {
        margin: 0;
        font-weight: 500;
        font-size: 36px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
      }
      .join-title em {
        font-style: normal;
        color: #ffd3c4;
      }
      .join .join-label {
        display: grid;
        gap: 8px;
        font-size: 13px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.7);
      }
      .join .join-label input {
        height: 50px;
        padding: 0 16px;
        border: 0;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.26);
        color: #fff;
        font-size: 17px;
      }
      .join .join-label input:focus {
        outline: 0;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      }
      .join .join-label input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }
      .join .error {
        color: #ffd3c4;
        font-size: 14px;
      }
      .join-go {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        height: 50px;
        border: 0;
        border-radius: 14px;
        background: #fff;
        color: #1f1a14;
        font-weight: 600;
        font-size: 16px;
      }
      .join-go:hover {
        background: #fff5ee;
      }
      .rec {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff4d57;
        box-shadow: 0 0 0 4px rgba(255, 77, 87, 0.25);
      }
      .join :focus-visible {
        outline-color: #fff;
      }
      @media (max-width: 860px) {
        .join {
          place-items: start center;
          padding: max(20px, env(safe-area-inset-top)) 16px 24px;
        }
        .join-main {
          grid-template-columns: minmax(0, 520px);
          gap: 24px;
          justify-content: center;
        }
        .join-title {
          font-size: 28px;
        }
      }
      label {
        display: grid;
        gap: 6px;
        color: var(--ink-3);
        font-size: 12px;
        font-weight: 600;
      }
      input {
        height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        background: var(--field);
        font-size: 14px;
        font-weight: 400;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }
      .primary {
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--on-ink);
        font-weight: 600;
      }
      .primary:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .error {
        color: var(--red-ink);
        font-size: 13px;
        margin: 0;
      }

      .room {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        position: relative;
      }
      .room.chat-closed {
        grid-template-columns: minmax(0, 1fr);
      }
      .room.chat-closed .chat {
        display: none;
      }
      .room:not(.chat-closed) .dock {
        left: calc((100% - 360px) / 2);
      }
      .room:not(.chat-closed) .tile.focused {
        right: 372px;
      }
      .chat {
        position: relative;
        z-index: 3;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        background: var(--surface);
        border-left: 1px solid var(--line);
      }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: max(12px, env(safe-area-inset-top)) 12px 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .chat-head b {
        font-size: 15px;
      }
      .chat-muted {
        color: var(--ink-3);
        font-size: 12px;
      }
      .chat-icon {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--ink-2);
      }
      .chat-icon:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .chat-head .chat-icon {
        margin-left: auto;
      }
      .chat-list {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 12px 4px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .chat-list:empty::before {
        content: "No messages yet. Paste a link, some code or a picture.";
        margin: auto;
        max-width: 220px;
        text-align: center;
        color: var(--ink-3);
        font-size: 13px;
      }
      .chat-msg {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        gap: 10px;
      }
      .chat-avatar,
      .chat-avatar svg {
        width: 30px;
        height: 30px;
      }
      .chat-who {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .chat-who b {
        font-size: 13px;
      }
      .chat-who span {
        color: var(--ink-3);
        font-size: 11px;
      }
      .chat-text {
        margin-top: 2px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .chat-text a {
        color: var(--accent);
        text-decoration: none;
      }
      .chat-text a:hover {
        text-decoration: underline;
      }
      .chat-inline {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--field);
        font:
          12.5px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .chat-code {
        position: relative;
        margin-top: 6px;
        border-radius: 8px;
        background: var(--field);
        box-shadow: 0 0 0 1px var(--line);
      }
      .chat-code pre {
        margin: 0;
        padding: 10px 64px 10px 12px;
        overflow-x: auto;
        font:
          12px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .chat-copy {
        position: absolute;
        top: 6px;
        right: 6px;
        height: 24px;
        padding: 0 8px;
        border: 0;
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink-2);
        font-size: 11px;
        font-weight: 600;
        box-shadow: 0 0 0 1px var(--line);
      }
      .chat-link {
        margin-top: 6px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--field);
        display: grid;
        gap: 1px;
        color: var(--ink);
        text-decoration: none;
      }
      .chat-link b {
        font-size: 13px;
      }
      .chat-link span {
        color: var(--ink-3);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-image {
        display: block;
        margin-top: 6px;
        max-width: min(100%, 260px);
        max-height: 220px;
        border-radius: 8px;
        box-shadow: 0 0 0 1px var(--line);
        cursor: zoom-in;
      }
      .chat-compose {
        display: grid;
        gap: 6px;
        padding: 10px 12px max(12px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
      }
      .chat-attachment {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chat-attachment img {
        height: 56px;
        border-radius: 6px;
        box-shadow: 0 0 0 1px var(--line);
      }
      .chat-remove {
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: var(--field);
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 600;
      }
      .chat-field {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding: 5px;
        border-radius: 12px;
        background: var(--field);
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }
      .chat-field:focus-within {
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .chat-field textarea {
        flex: 1;
        min-width: 0;
        height: 34px;
        max-height: 140px;
        resize: none;
        border: 0;
        outline: 0;
        background: none;
        color: var(--ink);
        font: inherit;
        line-height: 1.4;
        padding: 7px 4px;
      }
      .chat-field textarea::placeholder {
        color: var(--ink-3);
      }
      .chat-send {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: var(--on-ink);
      }
      .chat-hint {
        color: var(--ink-3);
        font-size: 11px;
        padding: 0 4px;
      }
      .chat-toggle {
        position: relative;
      }
      .chat-badge {
        position: absolute;
        top: 3px;
        right: 3px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: var(--red-ink);
        color: var(--on-red);
        font-size: 10px;
        font-weight: 700;
        line-height: 16px;
        text-align: center;
      }
      .chat-viewer {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgb(0 0 0 / 0.82);
        cursor: zoom-out;
      }
      .chat-viewer img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 8px;
      }
      @media (max-width: 720px) {
        .room {
          grid-template-columns: minmax(0, 1fr);
        }
        .chat {
          position: absolute;
          inset: 0;
          z-index: 6;
          border-left: 0;
        }
        .room:not(.chat-closed) .dock {
          left: 50%;
        }
        .chat-hint {
          display: none;
        }
      }
      .status {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        z-index: 3;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--line);
        color: var(--ink-2);
        font-size: 12px;
      }
      .status:empty {
        display: none;
      }
      .dock {
        position: absolute;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .group {
        display: flex;
        gap: 2px;
        padding: 6px;
        border-radius: 12px;
        background: var(--dock);
        box-shadow:
          0 0 0 1px var(--dock-line),
          0 2px 8px rgb(0 0 0 / 0.12);
      }
      .icon {
        width: 44px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--dock-ink);
      }
      .icon.chevron {
        width: 28px;
      }
      .icon.chevron svg {
        width: 16px;
        height: 16px;
      }
      .icon:hover {
        background: var(--dock-hover);
      }
      .icon[aria-pressed="true"] {
        background: var(--dock-on);
      }
      #mic .when-on,
      #mic[aria-pressed="true"] .when-off,
      #deafen .when-on,
      #deafen[aria-pressed="true"] .when-off,
      #camera .when-on,
      #camera[aria-pressed="true"] .when-off {
        display: none;
      }
      #mic[aria-pressed="true"] .when-on,
      #mic .when-off,
      #deafen[aria-pressed="true"] .when-on,
      #deafen .when-off,
      #camera[aria-pressed="true"] .when-on,
      #camera .when-off {
        display: grid;
      }
      .narrow-only {
        display: none !important;
      }
      @media (max-width: 560px) {
        .dock {
          gap: 6px;
        }
        .group {
          padding: 4px;
        }
        .icon {
          width: 38px;
        }
        .icon.chevron {
          width: 22px;
        }
        #effects,
        #avatar,
        #screen-menu-button {
          display: none;
        }
        .narrow-only {
          display: flex !important;
        }
        .dock .hangup {
          width: 52px;
        }
      }
      .hangup {
        width: 64px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 12px;
        background: var(--hangup);
        color: var(--on-hangup);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
      }
      .hangup:hover {
        filter: brightness(1.08);
      }
      .menu {
        position: absolute;
        bottom: calc(100% + 10px);
        min-width: 220px;
        max-width: min(320px, calc(100vw - 24px));
        max-height: 50vh;
        overflow: auto;
        padding: 6px;
        border-radius: 12px;
        background: var(--dock);
        box-shadow:
          0 0 0 1px var(--dock-line),
          0 8px 24px rgb(0 0 0 / 0.18);
        color: var(--dock-ink);
        display: grid;
        gap: 2px;
      }
      #mic-menu,
      #camera-menu {
        left: 0;
      }
      #screen-menu {
        left: 50%;
        transform: translateX(-50%);
      }
      #more-menu {
        right: 0;
      }
      .menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: inherit;
        text-align: left;
      }
      .menu button svg {
        width: 16px;
        height: 16px;
      }
      .menu button:hover {
        background: var(--dock-hover);
      }
      .menu button[aria-checked="true"]::after {
        content: "";
        width: 6px;
        height: 6px;
        margin-left: auto;
        border-radius: 50%;
        background: var(--green);

        left: 8px;

        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border-radius: 7px;
        background: rgb(0 0 0 / 0.6);
        color: var(--on-media);

        min-height: 0;
        display: grid;
        gap: 12px;
        justify-content: center;
        align-content: center;

      .tile {
        position: relative;
        margin: 0;
        border-radius: 12px;
        overflow: hidden;
        background: var(--surface);

        display: grid;
        place-items: center;

        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--media);
      }
      .room.focusing::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: var(--page);
      }
      .tile.focused {
        position: absolute;
        inset: max(12px, env(safe-area-inset-top)) 12px 88px;

        height: auto !important;

        right: 8px;

        color: var(--ink);

      }
      .ghost svg {
        width: 16px;
        height: 16px;
      }
      .sheet {
        width: min(440px, calc(100% - 24px));
        max-height: calc(100% - 24px);

        border: 0;
        border-radius: 12px;
        padding: 20px;

      }
      .picker-preview {
        justify-self: center;
        width: 160px;
        height: 160px;
      }
      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: var(--field);
      }
      .segmented button,

        background: var(--surface);
        color: var(--ink);

      }
      .swatches {

        flex-wrap: wrap;
        gap: 8px;

      }
      .swatch {
        width: 28px;
        height: 28px;

      }
      .shapes {

      .shape {

        padding: 6px;

              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            <span class="chat-badge" id="chat-badge" hidden></span>
          </button>
          <button class="icon" id="more-button" type="button" aria-haspopup="menu" aria-label="More" title="More">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="1" />
              <circle cx="19" cy="12" r="1" />
              <circle cx="5" cy="12" r="1" />
            </svg>
          </button>
        </div>
        <button class="hangup" id="leave" type="button" aria-label="Leave" title="Leave">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M10.1 13.9a14 14 0 0 0 3.732 2.668 1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2 18 18 0 0 1-12.728-5.272"
            />
            <path d="M22 2 2 22" />
            <path d="M4.76 13.582A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 .244.473" />
          </svg>
        </button>
        <div class="menu" id="mic-menu" role="menu" hidden></div>
        <div class="menu" id="camera-menu" role="menu" hidden></div>
        <div class="menu" id="screen-menu" role="menu" hidden></div>
        <div class="menu" id="more-menu" role="menu" hidden>
          <button type="button" role="menuitem" id="copy">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg
            ><span>Copy link</span>
          </button>
          <button type="button" role="menuitem" class="narrow-only" id="effects-item"><span>Camera effects</span></button>
          <button type="button" role="menuitem" class="narrow-only" id="avatar-item"><span>Your avatar</span></button>
          <div class="menu-line"></div>
          <div class="menu-label" id="people"></div>
          <div class="people-list" id="people-list"></div>
        </div>
      </nav>
    </section>
    <dialog class="sheet" id="picker" aria-labelledby="picker-title">
      <div class="sheet-head">
        <strong id="picker-title">Your avatar</strong>
        <button class="ghost" id="shuffle" type="button">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m18 14 4 4-4 4" />
            <path d="m18 2 4 4-4 4" />
            <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-7.6a4 4 0 0 1 3.3-1.7H22" />
            <path d="M2 6h1.972a4 4 0 0 1 3.346 1.806" />
            <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
          </svg>
          <span>Shuffle</span>
        </button>
      </div>
      <div class="picker-preview" id="picker-preview"></div>
      <div class="segmented" id="materials" role="group" aria-label="Finish">
        <button type="button" data-material="flat">Flat</button>
        <button type="button" data-material="fluffy">Fluffy</button>
      </div>
      <div class="swatches" id="swatches" role="group" aria-label="Color"></div>
      <div class="shapes" id="shapes" role="group" aria-label="Shape"></div>
      <button class="primary" id="picker-done" type="button">Done</button>
    </dialog>

    <dialog class="sheet" id="effects-sheet" aria-labelledby="effects-title">
      <div class="sheet-head"><strong id="effects-title">Camera effects</strong></div>
      <p class="sheet-note">Everyone sees your camera with the effect.</p>
      <div class="effects" id="effect-list" role="group" aria-label="Effect"></div>
      <button class="primary" id="effects-done" type="button">Done</button>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Milagre Live</title>
    <style>
      :root {
        --page: #f4f9fe;
        --surface: #ffffff;
        --field: #e8edf2;
        --hover: #1c222b0f;
        --line: #edeeee;
        --line-strong: #e0e1e3;
        --ink: #1c222b;
        --ink-2: #4b515a;
        --ink-3: #60656d;
        --on-ink: #ffffff;
        --accent: #007df3;
        --red-ink: #c62935;
        --on-red: #ffffff;
        --green: #199a4d;
        --media: #000000;
        --on-media: #ffffff;
        --hover-2: #1c222b1a;
        --dock: var(--surface);
        --dock-line: var(--line-strong);
        --dock-ink: var(--ink);
        --dock-ink-2: var(--ink-3);
        --dock-hover: var(--hover);
        --dock-on: var(--hover-2);
        --hangup: var(--red-ink);
        --on-hangup: var(--on-red);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d1624;
          --surface: #172232;
          --field: #212c3c;
          --hover: #e9eff70d;
          --line: #273242;
          --line-strong: #303b4a;
          --ink: #e9eff7;
          --ink-2: #abb2bd;
          --ink-3: #939ca9;
          --on-ink: #172232;
          --accent: #3e9afd;
          --red-ink: #fd696d;
          --on-red: #0d1624;
          --green: #3cbb72;
          --hover-2: #e9eff717;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--page);
        color: var(--ink);
        font:
          14px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Inter",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .join {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(360px, 100%);
        background: var(--surface);
        border-radius: 12px;
        box-shadow:
          0 0 0 1px var(--line),
          0 2px 8px rgb(0 0 0 / 0.08);
        padding: 24px;
        display: grid;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 15px;
      }
      .card p {
        margin: 0;
        color: var(--ink-2);
      }
      label {
        display: grid;
        gap: 6px;
        color: var(--ink-3);
        font-size: 12px;
        font-weight: 600;
      }
      input {
        height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        background: var(--field);
        font-size: 14px;
        font-weight: 400;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
        border-color: transparent;
      }
      .primary {
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--on-ink);
        font-weight: 600;
      }
      .primary:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .error {
        color: var(--red-ink);
        font-size: 13px;
        margin: 0;
      }

      .room {
        height: 100%;
        display: grid;
        position: relative;
      }
      .status {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        z-index: 2;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--line);
        color: var(--ink-2);
        font-size: 12px;
      }
      .status:empty {
        display: none;
      }
      .dock {
        position: absolute;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .group {
        display: flex;
        gap: 2px;
        padding: 6px;
        border-radius: 12px;
        background: var(--dock);
        box-shadow:
          0 0 0 1px var(--dock-line),
          0 2px 8px rgb(0 0 0 / 0.12);
      }
      .icon {
        width: 44px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--dock-ink);
      }
      .icon.chevron {
        width: 28px;
      }
      .icon.chevron svg {
        width: 16px;
        height: 16px;
      }
      .icon:hover {
        background: var(--dock-hover);
      }
      .icon[aria-pressed="true"] {
        background: var(--dock-on);
      }
      #mic .when-on,
      #mic[aria-pressed="true"] .when-off,
      #deafen .when-on,
      #deafen[aria-pressed="true"] .when-off,
      #camera .when-on,
      #camera[aria-pressed="true"] .when-off {
        display: none;
      }
      #mic[aria-pressed="true"] .when-on,
      #mic .when-off,
      #deafen[aria-pressed="true"] .when-on,
      #deafen .when-off,
      #camera[aria-pressed="true"] .when-on,
      #camera .when-off {
        display: grid;
      }
      .hangup {
        width: 64px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 12px;
        background: var(--hangup);
        color: var(--on-hangup);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
      }
      .hangup:hover {
        filter: brightness(1.08);
      }
      .menu {
        position: absolute;
        bottom: calc(100% + 10px);
        min-width: 220px;
        max-width: min(320px, calc(100vw - 24px));
        max-height: 50vh;
        overflow: auto;
        padding: 6px;
        border-radius: 12px;
        background: var(--dock);
        box-shadow:
          0 0 0 1px var(--dock-line),
          0 8px 24px rgb(0 0 0 / 0.18);
        color: var(--dock-ink);
        display: grid;
        gap: 2px;
      }
      #mic-menu,
      #camera-menu {
        left: 0;
      }
      #screen-menu {
        left: 50%;
        transform: translateX(-50%);
      }
      #more-menu {
        right: 0;
      }
      .menu button {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: inherit;
        text-align: left;
      }
      .menu button svg {
        width: 16px;
        height: 16px;
      }
      .menu button:hover {
        background: var(--dock-hover);
      }
      .menu button[aria-checked="true"]::after {
        content: "";
        width: 6px;
        height: 6px;
        margin-left: auto;
        border-radius: 50%;
        background: var(--green);
      }
      .menu-line {
        height: 1px;
        margin: 4px 6px;
        background: var(--dock-line);
      }
      .menu-label {
        padding: 4px 10px;
        color: var(--dock-ink-2);
        font-size: 12px;
        font-weight: 600;
      }
      .tile .remove {
        position: absolute;
        top: 8px;
        right: 8px;
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: rgb(0 0 0 / 0.6);
        color: var(--on-media);
        font-size: 12px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .tile:hover .remove,
      .tile .remove:focus-visible,
      .tile .remove[data-armed] {
        opacity: 1;
      }
      @media (hover: none) {
        .tile .remove {
          opacity: 1;
        }
      }
      .remove[data-armed] {
        background: var(--hangup) !important;
        color: var(--on-hangup) !important;
      }
      .tile .volume {
        position: absolute;
        top: 8px;
        left: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border-radius: 7px;
        background: rgb(0 0 0 / 0.6);
        color: var(--on-media);
        opacity: 0;
        transition: opacity 0.15s;
      }
      .tile:hover .volume,
      .tile .volume:focus-within {
        opacity: 1;
      }
      @media (hover: none) {
        .tile .volume {
          opacity: 1;
        }
      }
      .volume-icon {
        display: grid;
      }
      .volume input {
        --fill: 100%;
        width: 96px;
        height: 4px;
        margin: 0;
        appearance: none;
        border-radius: 2px;
        background: linear-gradient(to right, var(--on-media) var(--fill), rgb(255 255 255 / 0.3) var(--fill));
        cursor: pointer;
      }
      .volume input::-webkit-slider-thumb {
        appearance: none;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--on-media);
      }
      .volume input::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border: 0;
        border-radius: 50%;
        background: var(--on-media);
      }
      .person {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }
      .person > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag {
        padding: 1px 6px;
        border-radius: 5px;
        background: var(--dock-on);
        color: var(--dock-ink-2);
        font-size: 11px;
        font-weight: 600;
      }
      .menu .remove.inline {
        margin-left: auto;
        min-height: 26px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--dock-ink-2);
      }
      .people-list {
        display: grid;
        padding: 0 10px 6px;
        gap: 4px;
        color: var(--dock-ink);
      }
      main {
        min-height: 0;
        overflow: hidden;
        padding: 12px 12px 88px;
        display: grid;
        gap: 12px;
      }
      main.presenting {
        grid-template-columns: 1fr clamp(180px, 24%, 380px);
      }
      @media (max-width: 720px) {
        main.presenting {
          grid-template-columns: 1fr;
          grid-template-rows: 3fr 2fr;
        }
      }
      .area {
        min-width: 0;
        min-height: 0;
        display: grid;
        gap: 12px;
        justify-content: center;
        align-content: center;
      }
      .tile {
        position: relative;
        margin: 0;
        border-radius: 12px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--line);
        container-type: size;
        display: grid;
        place-items: center;
      }
      .tile video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--media);
        cursor: zoom-in;
      }
      .tile:fullscreen,
      .tile:-webkit-full-screen {
        border-radius: 0;
        box-shadow: none;
        background: var(--media);
      }
      figure.tile:fullscreen video,
      figure.tile:-webkit-full-screen video {
        object-fit: contain;
        cursor: zoom-out;
      }
      .tile.camera video {
        object-fit: cover;
      }
      .tile.mine video {
        transform: scaleX(-1);
      }
      .avatar,
      .join-avatar-bot,
      .picker-preview {
        cursor: pointer;
      }
      .avatar {
        width: min(46cqw, 58cqh);
        aspect-ratio: 1;
      }
      .avatar svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .tile.speaking {
        box-shadow:
          0 0 0 3px var(--green),
          0 0 0 1px var(--line);
      }
      .mic-state {
        display: inline-grid;
        place-items: center;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .mic-state.off {
        color: #fd696d;
      }
      #mic[aria-pressed="false"],
      #deafen[aria-pressed="true"] {
        color: var(--hangup);
      }
      #deafen[aria-pressed="true"] {
        background: none;
      }
      .tile figcaption {
        position: absolute;
        left: 8px;
        bottom: 8px;
        max-width: calc(100% - 16px);
        padding: 2px 8px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.55);
        color: var(--on-media);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 80px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--on-ink);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        pointer-events: none;
      }
      .ghost {
        height: 32px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 0;
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
        font-weight: 600;
      }
      .ghost svg {
        width: 16px;
        height: 16px;
      }
      .join-avatar {
        justify-self: center;
        display: grid;
        justify-items: center;
        gap: 4px;
        border: 0;
        background: none;
        color: var(--ink-3);
        font-size: 12px;
        font-weight: 600;
        padding: 4px;
        border-radius: 12px;
      }
      .join-avatar:hover {
        color: var(--ink);
      }
      .join-avatar-bot {
        width: 96px;
        height: 96px;
      }
      .sheet {
        width: min(440px, calc(100% - 24px));
        max-height: calc(100% - 24px);
        overflow: auto;
        border: 0;
        border-radius: 12px;
        padding: 20px;
        background: var(--surface);
        color: var(--ink);
        box-shadow:
          0 0 0 1px var(--line),
          0 12px 40px rgb(0 0 0 / 0.3);
      }
      .sheet[open] {
        display: grid;
        gap: 16px;
      }
      .sheet::backdrop {
        background: rgb(0 0 0 / 0.4);
      }
      .sheet-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
      }
      .sheet-note {
        margin: -8px 0 0;
        color: var(--ink-2);
      }
      .picker-preview {
        justify-self: center;
        width: 160px;
        height: 160px;
      }
      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        border-radius: 10px;
        background: var(--field);
      }
      .segmented button,
      .effects button {
        height: 32px;
        border: 0;
        border-radius: 7px;
        background: none;
        font-weight: 600;
        color: var(--ink-2);
      }
      .segmented button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line-strong);
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 0;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.15);
      }
      .swatch[aria-pressed="true"] {
        box-shadow:
          0 0 0 2px var(--surface),
          0 0 0 4px var(--ink);
      }
      .shapes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
        gap: 6px;
      }
      .shape {
        aspect-ratio: 1;
        padding: 6px;
        border: 0;
        border-radius: 10px;
        background: var(--field);
      }
      .shape:hover {
        box-shadow: inset 0 0 0 100px var(--hover);
      }
      .shape[aria-pressed="true"] {
        box-shadow: inset 0 0 0 2px var(--ink);
      }
      .shape svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .effects {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 6px;
      }
      .effects button {
        height: 40px;
        background: var(--field);
      }
      .effects button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--on-ink);
      }
    </style>
  </head>
  <body>
    <section class="join" id="join">
      <form class="card" id="join-form" novalidate>
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 146 145" fill="currentColor" aria-hidden="true">
            <path
              d="M69.528 1.96636C71.0759 -0.655453 74.869 -0.655453 76.4169 1.96636L91.0103 26.6837C91.3538 27.2656 91.8392 27.751 92.4211 28.0945L117.138 42.6879C119.76 44.2358 119.76 48.0289 117.138 49.5768L92.4211 64.1702C91.8392 64.5137 91.3538 64.9991 91.0103 65.581L76.4169 90.2983C74.869 92.9201 71.0759 92.9201 69.528 90.2983L54.9347 65.581C54.5911 64.9991 54.1057 64.5137 53.5238 64.1702L28.8065 49.5768C26.1847 48.0289 26.1847 44.2358 28.8065 42.6879L53.5238 28.0945C54.1057 27.751 54.5911 27.2656 54.9347 26.6837L69.528 1.96636Z"
            />
            <path
              d="M49.6983 66.5562L21.6836 116.174C19.802 119.507 22.2098 123.632 26.0372 123.632H39.9727L54.9727 100.132L66.9727 119.632L51.9727 144.132H26.0372C6.24066 144.132 -6.29344 122.89 3.27837 105.561L30.9405 55.4819L49.6983 66.5562Z"
            />
            <path
              d="M142.666 105.561C152.238 122.89 139.704 144.132 119.907 144.132H93.9728L78.9728 119.632L90.9728 100.132L105.973 123.632H119.907C123.735 123.632 126.143 119.507 124.261 116.174L96.2462 66.5562L115.004 55.4819L142.666 105.561Z"
            />
          </svg>
          Milagre Live
        </div>
        <p id="join-intro">Talk, share your screen or turn on your camera with anyone who has the link.</p>
        <button class="join-avatar" id="join-avatar-button" type="button" aria-label="Customize your avatar">
          <div class="join-avatar-bot" id="join-avatar"></div>
          <span>Customize</span>
        </button>
        <label>Your name <input id="name" name="name" autocomplete="name" maxlength="40" required /></label>
        <p class="error" id="join-error" hidden></p>
        <button class="primary" id="join-button" type="submit">Start a room</button>
      </form>
    </section>

    <section class="room" id="room" hidden>
      <div class="status" id="status" role="status"></div>
      <main id="stage">
        <div class="area" id="screens" hidden></div>
        <div class="area" id="gallery"></div>
      </main>
      <nav class="dock" aria-label="Call controls">
        <div class="group">
          <button class="icon" id="mic" type="button" aria-pressed="false" aria-label="Unmute" title="Unmute">
            <span class="when-on"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 19v3" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <rect x="9" y="2" width="6" height="13" rx="3" /></svg></span
            ><span class="when-off"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 19v3" />
                <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33" />
                <path d="M16.95 16.95A7 7 0 0 1 5 12v-2" />
                <path d="M18.89 13.23A7 7 0 0 0 19 12v-2" />
                <path d="m2 2 20 20" />
                <path d="M9 9v3a3 3 0 0 0 5.12 2.12" /></svg
            ></span>
          </button>
          <button class="icon chevron" id="mic-menu-button" type="button" aria-haspopup="menu" aria-label="Choose microphone" title="Choose microphone">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <button class="icon" id="deafen" type="button" aria-pressed="false" aria-label="Deafen" title="Deafen">
            <span class="when-on"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 14h-1.343" />
                <path d="M9.128 3.47A9 9 0 0 1 21 12v3.343" />
                <path d="m2 2 20 20" />
                <path d="M20.414 20.414A2 2 0 0 1 19 21h-1a2 2 0 0 1-2-2v-3" />
                <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 2.6-6.4" /></svg></span
            ><span class="when-off"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" /></svg
            ></span>
          </button>
          <button class="icon" id="camera" type="button" aria-pressed="false" aria-label="Turn on camera" title="Turn on camera">
            <span class="when-on"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" />
                <rect x="2" y="6" width="14" height="12" rx="2" /></svg></span
            ><span class="when-off"
              ><svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.196" />
                <path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2" />
                <path d="m2 2 20 20" /></svg
            ></span>
          </button>
          <button class="icon chevron" id="camera-menu-button" type="button" aria-haspopup="menu" aria-label="Choose camera" title="Choose camera">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
        </div>
        <div class="group">
          <button class="icon" id="screen" type="button" aria-pressed="false" aria-label="Share your screen" title="Share your screen">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m9 10 3-3 3 3" />
              <path d="M12 13V7" />
              <rect width="20" height="14" x="2" y="3" rx="2" />
              <path d="M12 17v4" />
              <path d="M8 21h8" />
            </svg>
          </button>
          <button class="icon chevron" id="screen-menu-button" type="button" aria-haspopup="menu" aria-label="Screen quality" title="Screen quality">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <button class="icon" id="effects" type="button" aria-pressed="false" aria-label="Camera effects" title="Camera effects">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"
              />
              <path d="M20 3v4" />
              <path d="M22 5h-4" />
              <path d="M4 17v2" />
              <path d="M5 18H3" />
            </svg>
          </button>
          <button class="icon" id="avatar" type="button" aria-label="Your avatar" title="Your avatar">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 8V4H8" />
              <rect width="16" height="12" x="4" y="8" rx="2" />
              <path d="M2 14h2" />
              <path d="M20 14h2" />
              <path d="M15 13v2" />
              <path d="M9 13v2" />
            </svg>
          </button>
          <button class="icon" id="more-button" type="button" aria-haspopup="menu" aria-label="More" title="More">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="1" />
              <circle cx="19" cy="12" r="1" />
              <circle cx="5" cy="12" r="1" />
            </svg>
          </button>
        </div>
        <button class="hangup" id="leave" type="button" aria-label="Leave" title="Leave">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M10.1 13.9a14 14 0 0 0 3.732 2.668 1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2 18 18 0 0 1-12.728-5.272"
            />
            <path d="M22 2 2 22" />
            <path d="M4.76 13.582A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 .244.473" />
          </svg>
        </button>
        <div class="menu" id="mic-menu" role="menu" hidden></div>
        <div class="menu" id="camera-menu" role="menu" hidden></div>
        <div class="menu" id="screen-menu" role="menu" hidden></div>
        <div class="menu" id="more-menu" role="menu" hidden>
          <button type="button" role="menuitem" id="copy">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" /></svg
            ><span>Copy link</span>
          </button>
          <div class="menu-line"></div>
          <div class="menu-label" id="people"></div>
          <div class="people-list" id="people-list"></div>
        </div>
      </nav>
    </section>
    <dialog class="sheet" id="picker" aria-labelledby="picker-title">
      <div class="sheet-head">
        <strong id="picker-title">Your avatar</strong>
        <button class="ghost" id="shuffle" type="button">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m18 14 4 4-4 4" />
            <path d="m18 2 4 4-4 4" />
            <path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-7.6a4 4 0 0 1 3.3-1.7H22" />
            <path d="M2 6h1.972a4 4 0 0 1 3.346 1.806" />
            <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
          </svg>
          <span>Shuffle</span>
        </button>
      </div>
      <div class="picker-preview" id="picker-preview"></div>
      <div class="segmented" id="materials" role="group" aria-label="Finish">
        <button type="button" data-material="flat">Flat</button>
        <button type="button" data-material="fluffy">Fluffy</button>
      </div>
      <div class="swatches" id="swatches" role="group" aria-label="Color"></div>
      <div class="shapes" id="shapes" role="group" aria-label="Shape"></div>
      <button class="primary" id="picker-done" type="button">Done</button>
    </dialog>

    <dialog class="sheet" id="effects-sheet" aria-labelledby="effects-title">
      <div class="sheet-head"><strong id="effects-title">Camera effects</strong></div>
      <p class="sheet-note">Everyone sees your camera with the effect.</p>
      <div class="effects" id="effect-list" role="group" aria-label="Effect"></div>
      <button class="primary" id="effects-done" type="button">Done</button>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>

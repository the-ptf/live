      name="description"
      content="Share your Valorant match in 1080p at 60 with the game's sound, talk over a clean mic, and send one link. Free, no accounts, nothing to install."

    <meta property="og:description" content="Screen share in 1080p at 60 with game sound, voice with noise suppression. One link, no accounts." />

    <style>
      @font-face {
        font-family: Geist;
        src: url(/fonts/geist.woff2) format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Geist, Inter, system-ui, sans-serif;
        background: linear-gradient(180deg, #0f1433 0%, #1f2357 24%, #463a7f 44%, #8c4f78 62%, #d9746a 80%, #f4a978 92%, #f9cf9b 100%);
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .sky {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 720px;
        height: 720px;
        transform: translate(-50%, -58%);
        background: radial-gradient(circle, rgba(255, 128, 118, 0.42), rgba(255, 128, 118, 0.1) 38%, transparent 64%);
      }
      .horizon {
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -18vh;
        height: 42vh;
        background: radial-gradient(60% 60% at 50% 100%, rgba(255, 214, 160, 0.55), transparent 70%);
        filter: blur(10px);
      }
      .star {
        position: absolute;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background: #fff;
        opacity: var(--low);
        animation: twinkle var(--d) ease-in-out var(--delay) infinite;
      }
      .star.big {
        box-shadow:
          0 0 6px 1px rgba(255, 255, 255, 0.7),
          0 0 14px 2px rgba(255, 200, 190, 0.35);
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: var(--low);
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.35);
        }
      }
      main {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 36px;
        padding: 24px;
        width: 100%;
      }
      .mark {
        width: 76px;
        height: 76px;
        filter: drop-shadow(0 0 28px rgba(255, 110, 110, 0.9)) drop-shadow(0 0 64px rgba(255, 90, 95, 0.55));
        animation: breathe 4s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          filter: drop-shadow(0 0 38px rgba(255, 110, 110, 1)) drop-shadow(0 0 90px rgba(255, 90, 95, 0.7));
        }
      }
      h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      form {
        display: flex;
        align-items: center;
        gap: 6px;
        width: min(440px, 100%);
        padding: 6px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.26),
          0 14px 44px rgba(20, 10, 40, 0.35);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: box-shadow 0.2s;
      }
      form:focus-within {
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.5),
          0 14px 44px rgba(20, 10, 40, 0.4);
      }
      input {
        flex: 1;
        min-width: 0;
        height: 46px;
        padding: 0 14px;
        border: 0;
        outline: 0;
        background: transparent;
        color: #fff;
        font: inherit;
        font-size: 17px;
      }
      input::placeholder {
        color: rgba(255, 255, 255, 0.62);
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 46px;
        padding: 0 20px;
        border: 0;
        border-radius: 13px;
        background: #fff;
        color: #1f1a14;
        font: inherit;
        font-weight: 600;
        font-size: 16px;
        white-space: nowrap;
        cursor: pointer;
        transition:
          transform 0.15s,
          background 0.15s;
      }
      button:hover {
        background: #fff5ee;
      }
      button:active {
        transform: translateY(1px);
      }
      button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }
      .rec {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff4d57;
        box-shadow: 0 0 0 4px rgba(255, 77, 87, 0.25);
      }
      .hint {
        margin: -18px 0 0;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
      }
      .going {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.88);
      }
      .going .rec {
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 8px rgba(255, 77, 87, 0.05);
        }
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 520px) {
        main {
          gap: 30px;
        }
        form {
          flex-direction: column;
          align-items: stretch;
          padding: 8px;
        }
        button {
          height: 50px;
        }
        input {
          height: 48px;
          text-align: center;
        }
        .hint {
          margin-top: -14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .going .rec,
        .star,
        .mark {
          animation: none;
        }
      }
    </style>
